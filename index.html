<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موعد مشوار 🚗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>موعد مشوار 🚗✨</h1>
    <p class="sub">جاهزة للمشوار؟ حددي وش يناسبك</p>

    <label for="date">📅 اختاري اليوم</label>
    <input type="date" id="date">

    <label for="time">⏰ اختاري الوقت</label>
    <input type="time" id="time">

    <label for="place">📍 اختاري المكان</label>
    <input type="text" id="place" placeholder="اكتبي المكان اللي تبينه...">
    <p id="placeMsg" class="placeMsg"></p>

    <button id="sendBtn">تأكيد الموعد 💌</button>
    <p id="result" class="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
